name: build

# Builds release binaries on version tags and by hand. Tests run in test.yml.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            out: claude-account-switcher-windows-amd64.exe
            flags: -H=windowsgui -s -w
          - os: macos-latest
            out: claude-account-switcher-macos.zip
            flags: -s -w
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      # Version info and a manifest make an unsigned exe look less like
      # malware to Windows Defender's machine learning.
      - name: Windows resources
        if: runner.os == 'Windows'
        shell: bash
        working-directory: cmd/claude-account-switcher
        run: |
          v=$(sed -n 's/^const version = "\(.*\)"/\1/p' main.go)
          v=${v%%-*} # numbers only: 0.3.6-ext.1 is 0.3.6
          go run github.com/tc-hib/go-winres@v0.3.3 make --arch amd64 --product-version "$v.0" --file-version "$v.0"
      - name: Build
        shell: bash
        run: |
          mkdir -p dist
          if [ "$RUNNER_OS" = macOS ]; then
            CGO_ENABLED=1 GOARCH=arm64 go build -ldflags "${{ matrix.flags }}" -o dist/arm64 ./cmd/claude-account-switcher
            CGO_ENABLED=1 GOARCH=amd64 go build -ldflags "${{ matrix.flags }}" -o dist/amd64 ./cmd/claude-account-switcher
            # A menu bar app bundle around the universal binary, signed ad hoc
            # so Gatekeeper sees one consistent signature.
            app="dist/Claude Account Switcher.app"
            mkdir -p "$app/Contents/MacOS"
            lipo -create -output "$app/Contents/MacOS/claude-account-switcher" dist/arm64 dist/amd64
            rm dist/arm64 dist/amd64
            cp packaging/macos/Info.plist "$app/Contents/Info.plist"
            v=$(sed -n 's/^const version = "\(.*\)"/\1/p' cmd/claude-account-switcher/main.go)
            v=${v%%-*}
            plutil -replace CFBundleShortVersionString -string "$v" "$app/Contents/Info.plist"
            plutil -replace CFBundleVersion -string "$v" "$app/Contents/Info.plist"
            codesign --force --deep -s - "$app"
            (cd dist && ditto -c -k --keepParent "Claude Account Switcher.app" "${{ matrix.out }}" && rm -rf "Claude Account Switcher.app")
          else
            go build -ldflags "${{ matrix.flags }}" -o "dist/${{ matrix.out }}" ./cmd/claude-account-switcher
          fi
          cd dist && { sha256sum "${{ matrix.out }}" 2>/dev/null || shasum -a 256 "${{ matrix.out }}"; } > "${{ matrix.out }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: dist/${{ matrix.out }}*
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        # The notes are this version's section of CHANGES.md.
        run: |
          tr -d '\r' < CHANGES.md | awk -v h="## ${GITHUB_REF_NAME#v}" '$0 == h {f = 1; next} /^## / {f = 0} f' > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md 2>/dev/null || true
          gh release upload "$GITHUB_REF_NAME" "dist/${{ matrix.out }}" "dist/${{ matrix.out }}.sha256" --clobber
